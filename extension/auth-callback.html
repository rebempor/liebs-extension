<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liebs Extension Sign-In</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255, 204, 128, 0.45), transparent 45%),
        linear-gradient(180deg, #fff6ea 0%, #fffdf8 100%);
      color: #2d231c;
    }

    main {
      width: min(92vw, 420px);
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(119, 76, 30, 0.12);
      box-shadow: 0 18px 50px rgba(67, 35, 5, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }

    p {
      margin: 0;
      line-height: 1.5;
      color: #6a5646;
    }

    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      background: #2d231c;
      color: white;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }

    button[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Finishing sign-in</h1>
    <p id="status-text">Connecting your browser session to the extension...</p>
    <button id="close-btn" type="button" hidden>Close this tab</button>
  </main>

  <script src="vendor/sentry.min.js"></script>
  <script src="sentry-init.js"></script>
  <script src="shared-core.js"></script>
  <script src="auth-callback.js"></script>
</body>
</html>
