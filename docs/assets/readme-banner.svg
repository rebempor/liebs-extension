    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#baa7ff"/><stop offset="1" stop-color="#f6adc9"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
