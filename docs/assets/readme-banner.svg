<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Liebs — A little character. A better hello.</title>
  <desc id="desc">A dark violet banner illustrating the concept: profile photo, AI character, personal greeting.</desc>
  <defs>
